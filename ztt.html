<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>这是一个标题</title>
	</head>
	<body>
		<h1>这是一个一级标题</h1>
		<h2>这是一个二级标题</h2>
		<h3>这是一个三级标题</h3>
		<h4>这是一个四级标题</h4>
		<h5>这是一个五级标题</h5>
		<h6>这是一个六级标题</h6>
		<!-- HTML最大支持6个标题 -->
		<p>这是一个段落</p>
		<p><b>这是一个加粗的段落</b><i>这是一个斜体的段落</i><u>这是一个下划线的段落</u></p>
		<ul>
			<li>这是一个无序列表</li>
			<li>这是一个无序列表</li>
			<li>这是一个无序列表</li>
		</ul>
		<ol>
			<li>这是一个有序列表</li>
			<li>这是一个有序列表</li>
			<li>这是一个有序列表</li>
		</ol>
		<table border="1">
			<th>表头1</th>
			<th>表头2</th>
			<th>表头3</th>
			<tr>
				<td>单元格1</td>
				<td>单元格2</td>
				<td>单元格3</td>
			</tr>
			<tr>
				<td>单元格4</td>
				<td>单元格5</td>
				<td>单元格6</td>
			</tr>
		</table>
		<a href="https://www.baidu.com">点击访问百度</a>
		<hr>
		<a href="https://www.baidu.com" target="_blank">点击访问百度</a>
		<br>
		<img src="img/OIP-C.jfif" alt="这是一个餐厅的图片" width="240" height="135px">
	</body>
</html>
