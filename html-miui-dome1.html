<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
    <style>
        .s-img{
            width: 55px;
            height: 55px;
			margin: 0px 20px;
        }
		.mui-input-row{
			background-color: #FFFFFF;
		}
    </style>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
    </script>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
        <h1 class="mui-title">XX学校管理系统</h1>
    </header>

    <div class="mui-content">
		<div class="mui-input-row" style="margin-top: 20px;">
			<label>账号</label>
			<input type="text" class="mui-input-clear" placeholder="请输入账号名">
		</div>
		<div class="mui-input-row">
			<label>密码t</label>
			<input type="password" class="mui-input-password" placeholder="请输入密码">
		</div>
		<div class="mui-input-row" style="margin-top: 20px;">
			<label>自动登录</label>
			<div class="mui-switch mui-switch-blue">
				<div class="mui-switch-handle"></div>
			</div>
		</div>
		<div style="margin: 30px 10px;"><button type="button" class="mui-btn mui-btn-blue mui-btn-block" style="margin-top: 40px;">登录</button></div>
		<div style="font-weight: bold; text-align: center;">
			<span style="color: #007AFF;">注册账号</span>
			<span style="color: #D3D3D3">|</span>
			<span style="color: #007AFF;">忘记密码</span>
		</div>
		
		
        <div style="display: flex;justify-content: center; position: absolute; bottom: 20px;width: 100%;">
            <img src="img/微信.png" alt="" class="s-img">
            <img src="img/微博.png" alt="" class="s-img">
            <img src="img/icon_QQ.png" alt="" class="s-img">
        </div>
    </div>

</body>
</html>
