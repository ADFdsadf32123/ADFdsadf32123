<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS浮动</title>
    <style>
        .father{
            background-color: aquamarine;
            height: 200px;
            border: 3px solid saddlebrown;
            overflow: hidden;
        }
        .left-ztt{
            width: 100px;
            height: 100px;
            background-color: red;
            float: left;
        }
        .right-ztt{
            width: 100px;
            height: 100px;
            background-color: blue;
            float: right;
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="left-ztt">这是一个左浮动元素</div>
        <div class="right-ztt">这是一个右浮动元素</div>
    </div>
    <p>这是一段普通的文字</p>
    
</body>
</html>
