<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS示例</title>
    <style>
        /* 这里编写本页面的CSS代码 */
    </style>
    <script>
        // 这里也可以编写JS代码
        console.log("Hello, World!，这是在head标签中的JS代码");
    </script>
    <script src="dome.js"></script>
</head>
<body>
    <script>
        // 这里可以编写JS代码
        console.log("Hello, World!，这是在body标签中的JS代码");
    </script>
    JS代码的加载顺序为，优先加载head标签中的JS代码，然后加载外联的JS代码，最后加载body标签中的JS代码。
</body>
</html>
